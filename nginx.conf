events {
    worker_connections 1024;
}

http {
    # 使用绝对路径引入 Nginx 内置的 mime.types 文件
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 【关键修复】关闭 sendfile，避免 Docker bind mount 下的 inode 缓存问题
    # 在 bind mount 场景下，sendfile 可能缓存旧文件的 inode，导致更新后仍返回旧内容
    sendfile off;

    # 开启 gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript;

    # 解决 413 Request Entity Too Large，允许上传大文件（图片/PDF）
    client_max_body_size 50M;

    # Frontend 配置 (云服务器 5174 端口映射到这里的 80)
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html/frontend/dist;
        index index.html;

        # HTML 文件禁止缓存，确保每次部署后浏览器加载最新入口
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files $uri /index.html;
        }

        # 带 hash 的静态资源（JS/CSS/图片/字体）可长期缓存
        # Vite 构建时所有资源文件都带有内容 hash，文件内容不变则文件名不变
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # 解决 React Router 刷新 404 的问题
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 代理后端 API 请求
        location /api/ {
            proxy_pass http://47.109.144.54:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # Admin Web 配置 (云服务器 5173 端口映射到这里的 8080)
    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html/admin_web/dist;
        index index.html;

        # HTML 文件禁止缓存
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files $uri /index.html;
        }

        # 带 hash 的静态资源可长期缓存
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # 解决 React Router 刷新 404 的问题
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 代理后端 API 请求
        location /api/ {
            proxy_pass http://47.109.144.54:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}