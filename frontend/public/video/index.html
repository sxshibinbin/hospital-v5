<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="description" content="健康监测设备演示视频在线播放" />
  <title>健康监测设备演示视频</title>
  <link rel="icon" type="image/webp" href="/favicon.webp" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      min-height: 100svh;
      color: #f7f8ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      background:
        radial-gradient(circle at 12% 0%, rgba(109, 59, 212, 0.28), transparent 38%),
        radial-gradient(circle at 88% 8%, rgba(47, 107, 255, 0.2), transparent 34%),
        #05070f;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .page {
      width: min(1200px, 100%);
      min-height: 100svh;
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .title-wrap { min-width: 0; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      padding: 4px 10px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      color: #c9b8ff;
      background: rgba(109, 59, 212, 0.16);
      font-size: 12px;
      letter-spacing: 0.08em;
    }
    h1 {
      margin: 0;
      font-size: clamp(20px, 3.4vw, 30px);
      line-height: 1.25;
      letter-spacing: -0.01em;
    }
    .subtitle {
      margin: 6px 0 0;
      color: #98a2bd;
      font-size: 13px;
      line-height: 1.6;
    }
    .live-dot {
      flex: none;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #47e0a0;
      box-shadow: 0 0 0 5px rgba(71, 224, 160, 0.12);
    }
    .player {
      position: relative;
      flex: 1;
      min-height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 22px;
      background: #000;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.03) inset;
    }
    video {
      display: block;
      width: 100%;
      height: 100%;
      max-height: 76svh;
      background: #000;
      object-fit: contain;
    }
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      border: 0;
      color: #fff;
      background: radial-gradient(circle at center, rgba(109, 59, 212, 0.42), rgba(3, 5, 12, 0.86));
      cursor: pointer;
      transition: opacity 0.25s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .overlay.hidden { opacity: 0; pointer-events: none; }
    .play-btn {
      display: grid;
      place-items: center;
      width: 86px;
      height: 86px;
      padding-left: 5px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8b5cf6, #4f46e5);
      box-shadow: 0 16px 40px rgba(99, 72, 246, 0.45);
      font-size: 34px;
      line-height: 1;
    }
    .overlay-title { font-size: 17px; font-weight: 600; }
    .overlay-hint { color: #b6bfd8; font-size: 13px; }
    .sound-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 3;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 14px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      color: #fff;
      background: rgba(8, 12, 24, 0.76);
      backdrop-filter: blur(10px);
      cursor: pointer;
      font: inherit;
      font-size: 13px;
    }
    .sound-btn[hidden] { display: none; }
    .tip {
      margin: 0;
      color: #7f89a5;
      font-size: 12px;
      line-height: 1.7;
      text-align: center;
    }
    @media (max-width: 640px) {
      .page { padding-left: 14px; padding-right: 14px; gap: 12px; }
      .player { border-radius: 16px; }
      .play-btn { width: 72px; height: 72px; font-size: 28px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div class="title-wrap">
        <span class="eyebrow">演示视频</span>
        <h1>健康监测设备演示</h1>
        <p class="subtitle">在线播放，无需下载视频文件</p>
      </div>
      <span class="live-dot" aria-hidden="true"></span>
    </header>

    <section class="player" id="player">
      <video
        id="video"
        src="/video/health-monitor-demo.mp4"
        controls
        playsinline
        preload="metadata"
        controlslist="nodownload noplaybackrate"
        disablepictureinpicture
      ></video>
      <button class="overlay" id="overlay" type="button" aria-label="播放演示视频">
        <span class="play-btn" aria-hidden="true">&#9654;</span>
        <span class="overlay-title">点击播放演示视频</span>
        <span class="overlay-hint">点击后开启声音播放</span>
      </button>
      <button class="sound-btn" id="soundBtn" type="button" hidden>开启声音</button>
    </section>

    <p class="tip">视频支持在线播放与拖动进度，网络较慢时会自动缓冲。</p>
  </main>

  <script>
    (function () {
      var video = document.getElementById('video');
      var overlay = document.getElementById('overlay');
      var soundBtn = document.getElementById('soundBtn');

      function hideOverlay() { overlay.classList.add('hidden'); }
      function showOverlay() { overlay.classList.remove('hidden'); }
      function updateSoundBtn() {
        soundBtn.hidden = !(video.muted && !video.paused);
      }

      overlay.addEventListener('click', function () {
        video.muted = false;
        video.play().then(function () {
          hideOverlay();
          updateSoundBtn();
        }).catch(function () {
          showOverlay();
        });
      });

      soundBtn.addEventListener('click', function () {
        video.muted = false;
        soundBtn.hidden = true;
      });

      video.addEventListener('play', function () {
        hideOverlay();
        updateSoundBtn();
      });
      video.addEventListener('volumechange', updateSoundBtn);
      video.addEventListener('pause', function () {
        if (video.ended || video.currentTime === 0) showOverlay();
        updateSoundBtn();
      });
      video.addEventListener('ended', showOverlay);

      var autoplay = video.play();
      if (autoplay && typeof autoplay.catch === 'function') {
        autoplay.then(updateSoundBtn).catch(function () {});
      }
    })();
  </script>
</body>
</html>
